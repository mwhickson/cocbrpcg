    <script>
        const DEFAULT_MOVE_RATE = 8;
        const DEFAULT_CHARACTERSTIC_VALUE_ARRAY = [ 40, 50, 50, 50, 60, 60, 70, 80 ];
        const PERSONAL_INTEREST_SKILL_BONUS_ARRAY = [20, 20, 20, 20];

        class Characteristic {
            #name = null;
            #code = null;

            constructor(name, code) {
                this.#name = String(name);
                this.#code = String(code);
            }

            get Name() {
                return this.#name;
            }

            get Code() {
                return this.#code;
            }
        }

        class CharacteristicValue {
            #characteristic = null;
            #value = 0;

            constructor(characteristic, value) {
                this.#characteristic = characteristic;
                this.#value = parseInt(value) ?? 0;
            }

            get Characteristic() {
                return this.#characteristic;
            }

            get Regular() {
                return this.#value;
            }

            get Half() {
                return Math.floor(this.#value / 2);
            }

            get Hard() {
                return this.Half();
            }

            get Fifth() {
                return Math.floor(this.#value / 5);
            }

            get Extreme() {
                return this.Fifth();
            }
        }

        class SecondaryAttribute {
            #name = null;
            #code = null;

            constructor(name, code) {
                this.#name = String(name);
                this.#code = String(code);
            }

            get Name() {
                return this.#name;
            }

            get Code() {
                return this.#code;
            }
        }

        class SecondaryAttributeValue {
            #attribute = null;
            #value = 0;

            constructor(attribute, value) {
                this.#attribute = attribute;
                this.#value = parseInt(value) ?? 0;
            }

            get Attribute() {
                return this.#attribute;
            }

            get Value() {
                return this.#value;
            }

            static CalculateDamageBonus(strength, size) {
                const total = parseInt(strength) + parseInt(size);

                const DamageBonusRanks = [
                    { Minimum: 2, Maximum: 64, Value: "-2" },
                    { Minimum: 65, Maximum: 84, Value: "-1" },
                    { Minimum: 85, Maximum: 124, Value: "None" },
                    { Minimum: 125, Maximum: 164, Value: "1d4" },
                    { Minimum: 165, Maximum: 204, Value: "1d6" },
                ];

                const rank = DamageBonusRanks.find(x => total >= x.Minimum && total <= x.Maximum );

                return rank ? String(rank.Value) : null;
            }

            static CalculateBuild(strength, size) {
                const total = parseInt(strength) + parseInt(size);

                const BuildRanks = [
                    { Minimum: 2, Maximum: 64, Value: -2 },
                    { Minimum: 65, Maximum: 84, Value: -1 },
                    { Minimum: 85, Maximum: 124, Value: 0 },
                    { Minimum: 125, Maximum: 164, Value: 1 },
                    { Minimum: 165, Maximum: 204, Value: 2 },
                ];

                const rank = BuildRanks.find(x => total >= x.Minimum && total <= x.Maximum );

                return rank ? parseInt(rank.Value) : null;
            }

            static CalculateHitPoints(size, constitution) {
                const total = parseInt(size) + parseInt(constitution);
                return Math.floor(total / 10);
            }

            static CalculateMoveRate() {
                return DEFAULT_MOVE_RATE;
            }

            static CalculateSanityPoints(power) {
                return parseInt(power);
            }

            static CalculateMagicPoints(power) {
                return Math.floor(power / 5);
            }

            static CalculateLuck() {
                const sides = 6;
                const count = 3;
                let total = 0;

                for (var i = 0; i < count; i++) {
                    total += Math.floor(sides * Math.random()) + 1;
                }

                return total;
            }
        }

        class Skill {
            #name = null;
            #defaultValue = null;
            #customizable = null;

            constructor(name, defaultValue, customizable) {
                this.#name = String(name);
                this.#defaultValue = parseInt(defaultValue) ?? 0;
                this.#customizable = parseBoolean(customizable) ?? false;
            }

            get Name() {
                return this.#name;
            }

            get DefaultValue() {
                return this.#defaultValue;
            }

            get Customizable() {
                return this.#customizable;
            }
        }

        class SkillValue {
            #skill = null;
            #value = 0;

            constructor(skill, value) {
                this.#skill = String(skill);
                this.#value = parseInt(value) ?? 0;
            }

            get Skill() {
                return this.#skill;
            }

            get Regular() {
                return this.#value;
            }

            get Half() {
                return Math.floor(this.#value / 2);
            }

            get Hard() {
                return this.Half();
            }

            get Fifth() {
                return Math.floor(this.#value / 5);
            }

            get Extreme() {
                return this.Fifth();
            }

            static CalculateDefaultDodge(dexterity) {
                return Math.floor(parseInt(dexterity) / 2);
            }

            static CalculateDefaultLanguageOwn(education) {
                return parseInt(education);
            }
        }

        class Occupation {
            #name = null;
            #skills = [];

            constructor(name, skills) {
                this.#name = String(name);
                this.#skills = Array.from(skills) ?? [];
            }

            get Name() {
                return this.#name;
            }

            get Skills() {
                return this.#skills;
            }
        }

        const Characteristics = [

        const SecondaryAttributes = [

            new Skill("Drive Auto", 20, false),

            new Skill("History", 5, false),

            new Skill("Language, Other", 1, true),
            new Skill("Language (Own)", null, false), // SkillValue.CalculateDefaultLanguageOwn()
            new Skill("Law", 5, false),

        const Occupations = [
            new Occupation("Antiquarian", []), // Appraise, Art/Craft, History, Library Use, Other Language, one interpersonal skill (Charm, Fast Talk, Intimidate or Persuade), Spot Hidden, any one other skill
            new Occupation("Author", []), // Art (literature), History, Library Use, Natural World or Occult, Other Language, Own Language, Psychology, any one other skill
            new Occupation("Dilettante", []), // Art/Craft, Firearms, Other Language, Ride, one interpersonal skill (Charm, Fast Talk, Intimidate or Persuade), any three other skills
            new Occupation("Doctor of Medicine", []), // First Aid, Other Language (Latin), Medicine, Psychology, Science (Biology), Science (Pharmacy), any two other skills as acadmeic or personal specialties
            new Occupation("Journalist", []), // Art/Craft (Photography), History, Library Use, Own Language, one interpersonal skill (Charm, Fast Talk, Intimidate or Persuade), Psychology, any two other skills
            new Occupation("Police Detective", []), // Art/Craft (Acting) or Disguise, Firearms, Law, Listen, one interpersonal skill (Charm, Fast Talk, Intimidate or Persuade), Psychology, any two other skills
            new Occupation("Private Investigator", []), // Art/Craft (Photography), Disguise, Law, Library Use, one interpersonal skill (Charm, Fast Talk, Initimidate or Persuade), Psychology, Spot Hidden, and any one other skill
            new Occupation("Professor", []), // Library Use, Language, Own Language, Psychology, any four other skills as academic or personal specialties
        ];
    </script>
